<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Favorite Person</title>

  <!-- Cute rounded fonts: Fredoka for the storybook display type, Quicksand for soft body text -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600&family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============================================================
       THE SCENE
       A peaceful cartoon field: sky, sun, clouds, hills, grass,
       flowers, and little critters. Everything here is built with
       CSS shapes/gradients + inline SVG so the page works even
       before real art assets are dropped in.
  ============================================================ -->
  <div id="scene">

    <!-- Sky + sun -->
    <div id="sky">
      <div id="sun"></div>
      <div id="rainbow"></div>
      <div id="clouds"></div>
      <div id="birds"></div>
    </div>

    <!-- Rolling hills, behind the grass -->
    <div id="hills">
      <div class="hill hill-back"></div>
      <div class="hill hill-front"></div>
    </div>

    <!-- Grass layer, flowers + critters live on top of this -->
    <div id="grass">
      <div id="flowers"></div>
      <div id="critters"></div>
    </div>

    <!-- Pigs live in their own full-scene layer so their screen-space
         coordinates line up with getBoundingClientRect() math in JS -->
    <div id="pig-layer"></div>

    <!-- Floating ambient sparkles/petals over the whole scene -->
    <div id="ambient-particles"></div>

    <!-- The little hero of act one -->
    <div id="cookie-wrap">
      <button id="cookie" aria-label="Tap the fortune cookie">
        <svg viewBox="0 0 200 140" id="cookie-svg" xmlns="http://www.w3.org/2000/svg">
          <!-- Left half -->
          <g id="cookie-left">
            <path d="M100 15
                     C 40 15, 10 55, 12 85
                     C 14 112, 45 128, 98 128
                     C 98 90, 98 50, 100 15 Z"
                  fill="#E7B978" stroke="#C99756" stroke-width="3" />
          </g>
          <!-- Right half -->
          <g id="cookie-right">
            <path d="M100 15
                     C 160 15, 190 55, 188 85
                     C 186 112, 155 128, 102 128
                     C 102 90, 102 50, 100 15 Z"
                  fill="#F1C98B" stroke="#C99756" stroke-width="3" />
          </g>
          <!-- Cute face, hidden once cookie starts cracking -->
          <g id="cookie-face">
            <circle cx="82" cy="70" r="4.5" fill="#5A3A1A" />
            <circle cx="118" cy="70" r="4.5" fill="#5A3A1A" />
            <path d="M82 88 Q100 100 118 88" stroke="#5A3A1A" stroke-width="3.5" fill="none" stroke-linecap="round" />
            <ellipse cx="70" cy="82" rx="6" ry="3.5" fill="#FFAFC0" opacity="0.7" />
            <ellipse cx="130" cy="82" rx="6" ry="3.5" fill="#FFAFC0" opacity="0.7" />
          </g>
        </svg>
      </button>
      <p id="cookie-hint">tap the cookie ✨</p>
    </div>

    <!-- Act two: the photo, revealed after the cookie cracks -->
    <div id="photo-stage">
      <div id="hearts-orbit"></div>
      <button id="photo-frame" aria-label="Our picture">
        <img id="photo" src="images/anurag.jpg" alt="My favorite person"
             onerror="this.onerror=null; this.src=''; this.classList.add('photo-fallback');" />
      </button>
      <h1 id="final-message">My Favorite Person <span class="heart-emoji">❤️</span></h1>
    </div>

    <!-- ============================================================
         CHAPTER TWO
         Warm sunset wash + zoom happen inside #scene so the whole
         act-one scene dims/zooms together; the envelope + letter
         live in a fixed overlay on top so they're unaffected by
         the scene's zoom transform.
    ============================================================ -->
    <div id="sunset-overlay"></div>

  </div>

  <div id="golden-particles" aria-hidden="true"></div>

  <div id="chapter-two" aria-hidden="true">

    <div id="envelope-wrap">
      <div id="envelope">
        <div class="env-shadow"></div>
        <div class="env-back"></div>
        <div class="env-pocket-left"></div>
        <div class="env-pocket-right"></div>
        <div class="env-flap">
          <div class="wax-seal">
            <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
              <circle cx="30" cy="30" r="27" fill="#8a1f2b" />
              <circle cx="30" cy="30" r="27" fill="url(#waxSheen)" />
              <path d="M30 20 C 24 12, 12 16, 12 25 C 12 33, 20 37, 30 44 C 40 37, 48 33, 48 25 C 48 16, 36 12, 30 20 Z"
                    fill="#6e1520" opacity="0.85" />
              <defs>
                <radialGradient id="waxSheen" cx="35%" cy="30%" r="75%">
                  <stop offset="0%" stop-color="#c94a55" stop-opacity="0.9" />
                  <stop offset="55%" stop-color="#8a1f2b" stop-opacity="0.2" />
                  <stop offset="100%" stop-color="#5c0f18" stop-opacity="0.5" />
                </radialGradient>
              </defs>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <div id="letter-wrap">
      <div id="letter">
        <div id="letter-text"><span id="ink-cursor"></span></div>
        <div id="letter-signature">Love,<br />Cookie</div>
      </div>
      <div id="letter-fx"></div>
    </div>

  </div>

  <!-- Floating Spotify player: starts collapsed as a small music-note
       button, expands into the real Spotify embed when tapped -->
  <div id="spotify-widget">
    <div id="spotify-player">
      <iframe
        data-testid="embed-iframe"
        style="border-radius: 12px"
        src="https://open.spotify.com/embed/track/5iFwAOB2TFkPJk8sMlxP8g?utm_source=generator&si=c4b853e088bc4397"
        width="100%"
        height="152"
        frameBorder="0"
        allowfullscreen=""
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
      </iframe>
    </div>
    <button id="spotify-toggle" aria-label="Toggle music player">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="1.6" fill="none"/><circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
    </button>
  </div>

  <!-- GSAP for the cinematic bits (cookie crack, pig choreography, bursts) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
